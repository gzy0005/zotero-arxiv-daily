<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搜索 · arXiv Daily</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});"></script>
  <link rel="stylesheet" href="/zotero-arxiv-daily/style.css">
</head>
<body>
<div class="container container-main py-4">

  <header class="site-header">
    <h1><a href="/zotero-arxiv-daily/">arXiv Daily</a></h1>
    <nav class="site-nav">
      <a href="/zotero-arxiv-daily/daily/2026-08-22/" class="">每日推荐</a>
      <a href="/zotero-arxiv-daily/deep-read/" class="">精读论文</a>
      <a href="/zotero-arxiv-daily/search/" class="active">搜索</a>
      <a href="/zotero-arxiv-daily/settings/" class="">设置</a>
    </nav>
  </header>

  

<h2 class="section-title">搜索论文</h2>

<div style="margin-bottom:1.5rem;">
  <input type="text" id="search-input" class="search-input" placeholder="输入关键词搜索标题、作者、摘要..." autofocus>
  <span id="search-count" class="search-count"></span>
</div>

<div id="search-results"></div>

<script>
(function() {
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');
  const count = document.getElementById('search-count');
  let index = [];
  let loaded = false;

  function render(papers) {
    if (!papers.length) {
      results.innerHTML = '<div class="empty-state"><p>没有找到匹配的论文。</p></div>';
      return;
    }
    const siteBase = '/zotero-arxiv-daily/';
    const html = papers.map(p => {
      const score = p.score != null ? '★ ' + p.score.toFixed(1) : '';
      const cats = (p.categories || []).map(c => '<span class="category-tag">' + c + '</span>').join('');
      return '<div class="paper-item">' +
        '<div class="paper-title"><a href="' + p.url + '" target="_blank">' + p.title + '</a></div>' +
        '<div class="paper-meta">' + p.date + ' · ' + (p.authors || []).slice(0,3).join(', ') + (p.authors && p.authors.length > 3 ? ' et al.' : '') + '</div>' +
        '<div class="paper-tldr collapsed">' + (p.tldr || '') + '</div>' +
        '<button class="btn-expand" onclick="toggleBrief(this)">展开</button>' +
        '<div class="paper-actions">' +
        (score ? '<span class="score-badge">' + score + '</span>' : '') +
        cats +
        (p.has_analysis ? ' <a href="' + siteBase + 'papers/' + p.arxiv_id + '/" class="btn-deepread done">已审阅</a>' :
          (p.arxiv_id ? ' <button class="btn-deepread" onclick="triggerAnalysis(\'' + p.arxiv_id + '\', this)">精读</button>' : '')) +
        '</div></div>';
    }).join('');
    results.innerHTML = html;
    count.textContent = '共 ' + papers.length + ' 篇';
  }

  fetch('/zotero-arxiv-daily/search-index.json')
    .then(r => r.json())
    .then(data => { index = data; loaded = true; filter(); })
    .catch(() => { results.innerHTML = '<div class="empty-state"><p>搜索索引加载失败。</p></div>'; });

  function filter() {
    const q = input.value.trim().toLowerCase();
    if (!q) { render(index.slice(0, 100)); return; }
    const words = q.split(/\s+/);
    const matched = index.filter(p => {
      const haystack = [p.title, (p.authors||[]).join(' '), p.abstract, p.tldr].join(' ').toLowerCase();
      return words.every(w => haystack.includes(w));
    });
    render(matched);
  }

  input.addEventListener('input', filter);
})();

function toggleBrief(button) {
  const brief = button.previousElementSibling;
  const collapsed = brief.classList.toggle('collapsed');
  button.textContent = collapsed ? '展开' : '收起';
}
function triggerAnalysis(arxivId, btn) {
  const pat = localStorage.getItem('github_pat');
  if (!pat) { window.location.href = '/zotero-arxiv-daily/settings/'; return; }
  btn.disabled = true;
  fetch('https://api.github.com/repos/gzy0005/zotero-arxiv-daily/actions/workflows/analyze.yml/dispatches', {
    method: 'POST', headers: {'Authorization': 'Bearer ' + pat, 'Accept': 'application/vnd.github+json'},
    body: JSON.stringify({ref: 'main', inputs: {arxiv_id: arxivId}})
  }).then(r => { if (r.ok) { btn.textContent = '已提交'; } else { btn.textContent = '精读'; btn.disabled = false; } });
}
</script>



  <footer>
    Generated by <a href="https://github.com/helemnmmm/zotero-arxiv-daily">zotero-arxiv-daily</a>.
    Hosted on <a href="https://pages.github.com/">GitHub Pages</a>.
  </footer>

</div>
</body>
</html>
