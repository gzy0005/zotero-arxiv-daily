name: Deep analyze paper
on:
  workflow_dispatch:
    inputs:
      arxiv_id:
        description: 'arXiv ID (e.g. 2402.12345)'
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run deep analysis
        env:
          ARXIV_ID: ${{ inputs.arxiv_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: uv run python src/zotero_arxiv_daily/deep_analyze.py

      - name: Build site
        env:
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
        run: uv run python site/build.py

      - name: Commit and push analysis data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/analysis/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add deep analysis for ${{ inputs.arxiv_id }}"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
