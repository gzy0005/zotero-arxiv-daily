name: Deep analyze paper
on:
  workflow_dispatch:
    inputs:
      arxiv_id:
        description: 'arXiv ID (e.g. 2402.12345)'
        required: true
        type: string
  issues:
    types: [opened]

jobs:
  analyze:
    if: ${{ github.event.issue == null || startsWith(github.event.issue.title, '精读:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Extract arXiv ID
        id: extract
        run: |
          if [ -n "${{ inputs.arxiv_id }}" ]; then
            echo "arxiv_id=${{ inputs.arxiv_id }}" >> $GITHUB_OUTPUT
          else
            TITLE="${{ github.event.issue.title }}"
            ID=$(echo "$TITLE" | grep -oP '\d{4}\.\d{4,5}' | head -1)
            echo "arxiv_id=$ID" >> $GITHUB_OUTPUT
            echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run deep analysis
        if: steps.extract.outputs.arxiv_id != ''
        env:
          ARXIV_ID: ${{ steps.extract.outputs.arxiv_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: uv run python src/zotero_arxiv_daily/deep_analyze.py

      - name: Build site
        if: steps.extract.outputs.arxiv_id != ''
        run: uv run python site/build.py

      - name: Commit and push analysis data
        if: steps.extract.outputs.arxiv_id != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/analysis/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add deep analysis for ${{ steps.extract.outputs.arxiv_id }}"
            git pull --rebase --autostash
            git push
          fi

      - name: Close issue
        if: steps.extract.outputs.issue_number != ''
        run: |
          gh issue close ${{ steps.extract.outputs.issue_number }} -c "分析完成：[查看结果](https://helemnmmm.github.io/zotero-arxiv-daily/papers/${{ steps.extract.outputs.arxiv_id }}/)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        if: steps.extract.outputs.arxiv_id != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
