name: Delete data and redeploy
on:
  workflow_dispatch:
    inputs:
      type:
        description: 'daily or analysis'
        required: true
        type: choice
        options:
          - daily
          - analysis
      id:
        description: 'Date (YYYY-MM-DD) or arXiv ID (e.g. 2402.12345)'
        required: true
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Delete daily data
        if: inputs.type == 'daily'
        run: |
          FILE="data/daily/${{ inputs.id }}.json"
          if [ -f "$FILE" ]; then
            rm "$FILE"
            echo "Deleted $FILE"
          else
            echo "File not found: $FILE (nothing to delete)"
          fi

      - name: Delete analysis data
        if: inputs.type == 'analysis'
        run: |
          FILE="data/analysis/${{ inputs.id }}.json"
          if [ -f "$FILE" ]; then
            rm "$FILE"
            echo "Deleted $FILE"
          else
            echo "File not found: $FILE (nothing to delete)"
          fi
          # Update index.json
          INDEX="data/analysis/index.json"
          if [ -f "$INDEX" ]; then
            uv run python -c "import json; idx = json.load(open('$INDEX')); idx = [e for e in idx if e.get('arxiv_id') != '${{ inputs.id }}']; json.dump(idx, open('$INDEX', 'w'), ensure_ascii=False, indent=2); print(f'Removed ${{ inputs.id }} from index ({len(idx)} entries remain)')"
          fi

      - name: Commit and push deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.type }}" = "daily" ]; then
            git add data/daily/
          else
            git add data/analysis/
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: delete ${{ inputs.type }} ${{ inputs.id }} [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Build site
        run: uv run python site/build.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
