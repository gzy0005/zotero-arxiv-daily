zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null
  ignore_path: null

source:
  arxiv:
    category: ["astro-ph.GA","astro-ph.HE","astro-ph.CO","gr-qc","astro-ph.SR","astro-ph.IM"]
    include_cross_list: true
  biorxiv:
    category: null
  medrxiv:
    category: null

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  generation_kwargs:
    max_tokens: 16384
    model: deepseek-v4-flash
  full_text_chunk_tokens: 6000
  full_text_chunk_overlap_tokens: 300
  language: Chinese

reranker:
  local:
    model: jinaai/jina-embeddings-v5-text-nano-retrieval
    encode_kwargs:
      task: retrieval
      prompt_name: document
  api:
    key: null
    base_url: null
    model: null
    batch_size: null

executor:
  debug: false
  send_empty: false
  max_paper_num: 50
  full_text_brief_paper_num: 20
  source: ['arxiv']
  reranker: local
